[project]
name = "market-copilot"
version = "0.1.0"
description = "Agentic RAG assistant over SEC filings and stock price data with forecasting model integration"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "pandas==2.2.3",
    "yfinance==1.6.0",
    "requests==2.32.3",
    "tenacity==9.0.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "langchain-text-splitters==0.3.2",
    "sentence-transformers==3.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.7.4",
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "dvc==3.67.1",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
