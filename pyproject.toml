[project]
name = "market-research-agent"
version = "0.1.0"
description = "Agentic RAG assistant over SEC filings and stock price data with forecasting model integration"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pandas>=2.2.3",
    "yfinance>=1.6.0",
    "requests>=2.32.3",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "langchain-text-splitters>=0.3.2",
    "sentence-transformers>=3.2.1",
    "langchain-core>=0.3.86",
    "langchain-openai>=0.3.35",
    "langchain-deepseek>=0.1.4",
    "langchain-anthropic>=0.3.22",
    "torch>=2.13.0",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.0",
    "arch>=8.0.0",
    "mlflow>=3.16.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "joblib>=1.5.3",
    "langgraph>=1.0.1",
    "langfuse>=4.15.6",
    "langchain>=1.0",
    "deepeval>=3.4.6",
    "ragas>=0.3",
    "tabulate>=0.9.0",
    "fastapi>=0.142.1",
    "uvicorn>=0.54.0",
    "gradio>=6.29.0",
    "plotly>=7.1.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.4",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "dvc>=3.67.1",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The paid LLM eval gate is opt-in: `pytest -m eval`.
addopts = "-m 'not eval'"
markers = ["eval: paid LLM-judged evaluation gate (deselected by default)"]

# CPU-only PyTorch wheels: the default Linux wheel bundles CUDA (~2 GB), which would bloat CI,
# the Docker image and the Hugging Face Space for a model this small.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
