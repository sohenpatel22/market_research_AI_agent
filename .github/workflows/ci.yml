name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql+psycopg://market_research_agent:market_research_agent@localhost:5432/market_research_agent
  UV_LINK_MODE: copy

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: market_research_agent
          POSTGRES_PASSWORD: market_research_agent
          POSTGRES_DB: market_research_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_research_agent -d market_research_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test (free tests only; the paid eval gate is a separate job)
        run: uv run pytest --cov=market_research_agent --cov-report=term-missing

  eval-gate:
    # Runs the real agent on a small golden subset and fails the build if DeepEval scores drop
    # below eval/thresholds.yaml. Skipped on forks/PRs without secrets (the tests self-skip
    # when no API key is present, so this job can never break a fork's build).
    needs: lint-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: market_research_agent
          POSTGRES_PASSWORD: market_research_agent
          POSTGRES_DB: market_research_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_research_agent -d market_research_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_ENVIRONMENT: ci
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Cache Hugging Face models (embedding model + reranker)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-msmarco-minilm

      - name: DeepEval gate
        run: uv run pytest -m eval -v

  docker-build:
    # Builds the runtime image and smoke-tests the running container against a real Postgres.
    needs: lint-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: market_research_agent
          POSTGRES_PASSWORD: market_research_agent
          POSTGRES_DB: market_research_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_research_agent -d market_research_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: market-research-agent:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image checks (non-root user, size)
        run: |
          test "$(docker run --rm market-research-agent:ci id -u)" = "1000"
          docker image ls market-research-agent:ci --format 'size: {{.Size}}'
          # secrets must not be baked into the image
          ! docker history --no-trunc market-research-agent:ci | grep -Ei 'api_key|secret'

      - name: Smoke test the container
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql+psycopg://market_research_agent:market_research_agent@localhost:5432/market_research_agent \
            market-research-agent:ci
          for i in $(seq 1 45); do
            curl -sf localhost:7860/health -o health.json && break
            sleep 2
          done
          cat health.json
          python3 -c "import json; d=json.load(open('health.json')); assert d['status'] in ('ok','degraded'); assert d['components']['forecast_models']['ok'], d"
          curl -sf localhost:7860/ | grep -q "Market Research Agent"
          curl -s -o /dev/null -w '%{http_code}\n' -X POST localhost:7860/chat \
            -H 'content-type: application/json' -d '{"question":"hi"}' | grep -q 422
          docker logs app | tail -20
