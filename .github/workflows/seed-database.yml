name: Seed production database

# Loads the corpus (prices, fundamentals, SEC filing chunks + embeddings) into the production
# Postgres (the DATABASE_URL secret, e.g. Neon). Safe to re-run: inserts are idempotent.
# Run it from the Actions tab before the first deploy, and again to refresh the data.
on:
  schedule:
    - cron: "17 5 * * 0"  # weekly refresh (Sunday 05:17 UTC)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers (default: the five supported ones)"
        required: false
        default: "AAPL MSFT NVDA JPM XOM"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # SEC EDGAR requires a descriptive User-Agent with contact info. Set a repository variable
      # SEC_EDGAR_USER_AGENT (Settings > Variables) to something like "Your Name you@example.com".
      SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT || 'Market Research Agent github-actions@users.noreply.github.com' }}
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.11

      - name: Install dependencies (runtime + ingestion libraries)
        run: uv sync --extra ingest

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-msmarco-minilm

      - name: Ingest
        env:
          TICKERS: ${{ inputs.tickers || 'AAPL MSFT NVDA JPM XOM' }}
        run: uv run python -m market_research_agent.data.ingest --tickers $TICKERS

      - name: Publish model forecasts and the backtest for BI dashboards
        run: uv run python -m market_research_agent.models.publish

      - name: Verify the database is populated
        run: uv run python scripts/preflight.py --require-data --skip-hf
